[project]
name = "fingerprintdriver-27c6-5125-tools"
version = "0.1.0"
description = "Protocol, pairing and analysis tools for the Goodix 27c6:5125 fingerprint sensor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "capstone>=5.0",               # tools/fwre: firmware disassembly
    "numpy>=2.0",
    "opencv-python-headless>=4.10", # tools/tune, image helpers
    "pefile>=2024.8.26",           # tools/wbgen, tools/algo: Windows DLL loading
    "pillow>=11.0",
    "pyusb>=1.3",                  # tools/goodix5125: USB access
    "unicorn>=2.1",                # tools/wbgen, tools/fwre: emulation
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# a set of scripts, not an installable package
package = false

[tool.pytest.ini_options]
testpaths = ["tools/wbgen", "tools/fwre"]
