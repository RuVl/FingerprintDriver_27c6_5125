# fprintd drop-in: let the goodix5125 driver use the frames the sensor
# captures when the power button is pressed with a finger (branch
# goodix5125-pov). The driver cannot tell a login from any other request:
# for ~3 minutes after a press that did not suspend the USB link, the first
# fingerprint request (lock screen, but also sudo, polkit or fprintd's
# duplicate check before an enrolment) is answered without a touch.
# Needs udev/71-goodix-5125-pov.rules (no USB autosuspend).
#
#   sudo install -Dm644 power-button-unlock.conf \
#     /etc/systemd/system/fprintd.service.d/power-button-unlock.conf
#   sudo systemctl daemon-reload && sudo systemctl restart fprintd
[Service]
Environment=GOODIX5125_POWER_BUTTON_UNLOCK=1
