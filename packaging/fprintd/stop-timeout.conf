# fprintd drop-in: do not hold up shutdown or a restart for 90 s when fprintd
# hangs. It saves nothing on exit (the goodix5125 driver writes its state on
# close and after each match).
#
#   sudo install -Dm644 stop-timeout.conf \
#     /etc/systemd/system/fprintd.service.d/stop-timeout.conf
#   sudo systemctl daemon-reload
[Service]
TimeoutStopSec=5s
